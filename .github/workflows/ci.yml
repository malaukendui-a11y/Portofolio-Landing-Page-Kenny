name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · build · test · Lighthouse
    runs-on: ubuntu-latest
    # M3: the 3D tests and the longer Lighthouse window add ~6 min; one run spent 11.5 min
    # installing Chromium's system packages alone.
    timeout-minutes: 35
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      # One Node major for the laptop, CI and Vercel: the same major as package.json
      # engines.node (docs/DECISIONS.md 2026-11-13, M4b batch 2). content.spec TC-097 checks both.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Two invocations (M5): the SwiftShader 3D project never shares the runner with the Firefox
      # and WebKit timing tests, and a failure in one browser still lets the other report.
      - name: Playwright (Chromium) smoke + axe + 3D
        run: pnpm exec playwright test --project=desktop --project=mobile --project=desktop-3d

      - name: Playwright (Firefox, WebKit) cross-browser
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --project=desktop-firefox --project=desktop-webkit --project=mobile-webkit

      # Headful Chrome under Xvfb: new-headless Chrome takes its pointer from the machine's input
      # devices, and the runner has none, so the 3D gate (fine pointer) would keep the lens off.
      # Xvfb's virtual pointer is a mouse.
      - name: Lighthouse CI (desktop)
        run: xvfb-run --auto-servernum pnpm exec lhci autorun --collect.headful

      # M3: the desktop gate counts only if every run measured the mounted 3D lens.
      - name: Lighthouse CI measured the 3D hero
        run: node scripts/check-lhci-3d.mjs

      - name: Lighthouse CI (mobile)
        run: pnpm exec lhci autorun --config=lighthouserc.mobile.cjs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-artifacts
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 7
          # .lighthouseci is a hidden directory, which upload-artifact skips by default.
          include-hidden-files: true
